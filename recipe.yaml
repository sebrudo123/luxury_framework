$engine: 3
$onesync: on
name: Luxury Framework
author: Luxury Framework Team
description: Receta oficial de Luxury Framework para FiveM. Despliegue completo y automatizado desde GitHub con arquitectura de 0.00ms resmon.

tasks:
  # 1. Descargar recursos base de CitizenFX (cfx-server-data)
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # 2. Descargar e instalar oxmysql desde GitHub Releases
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[standalone]

  - action: remove_path
    path: ./tmp/oxmysql.zip

  # 3. Descargar e instalar ox_lib (incluye cfxlua-require) desde GitHub Releases
  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip

  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[standalone]

  - action: remove_path
    path: ./tmp/ox_lib.zip

  # 4. Conectar a la base de datos MySQL/MariaDB
  - action: connect_database

  # 5. Descargar Luxury Framework completo desde GitHub
  - action: download_github
    src: https://github.com/sebrudo123/luxury_framework
    ref: main
    dest: ./tmp/luxury

  # Evitar duplicado de cfxlua-require si ox_lib.zip ya lo incluyo en [standalone]
  - action: remove_path
    path: ./tmp/luxury/resources/cfxlua-require

  # 6. Ejecutar migraciones SQL del framework en la base de datos
  - action: query_database
    file: ./tmp/luxury/install.sql

  # 7. Desplegar configuración server.cfg optimizada
  - action: move_path
    src: ./tmp/luxury/server.cfg
    dest: ./server.cfg

  # 8. Mover todos los recursos del framework a resources/[luxury]
  - action: move_path
    src: ./tmp/luxury/resources
    dest: ./resources/[luxury]

  # 9. Limpiar archivos temporales
  - action: remove_path
    path: ./tmp
