## ====================================================================
## LUXURY FRAMEWORK - PLANTILLA OFICIAL DE CONFIGURACIÓN (SERVER.CFG)
## Arquitectura de ultra-alto rendimiento (0.00ms Resmon)
## ====================================================================

## Puertos y Endpoints del Servidor
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

## Configuración de Base de Datos MariaDB / MySQL (oxmysql)
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 150
set mysql_ui true

## Información Pública y Metadatos del Servidor
sv_hostname "{{serverName}}"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "Servidor potenciado por Luxury Framework • Base Multi-Framework a 0.00ms"
sets locale "es-ES"
sets tags "luxury, roleplay, esx, qbcore, spanish, espana, latino, optimized, fps"
sets banner_detail "https://i.imgur.com/example_banner.png"
sets banner_connecting "https://i.imgur.com/example_connecting.png"

## Clave de Licencia y Capacidad (Slots)
sv_maxclients {{maxClients}}
sv_licenseKey "{{svLicense}}"
sv_scriptHookAllowed 0
set steam_webApiKey "none"

## Configuración de Voz Integrada (PMA-Voice Compatible)
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "Z"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1

## ====================================================================
## ORDEN DE ARRANQUE ESTANDARIZADO DE RECURSOS
## ====================================================================

## 1. Dependencias Base de CitizenFX (cfx-server-data)
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

## 2. Conectores Base y Módulo Require (Overextended)
ensure oxmysql
ensure cfxlua-require
ensure ox_lib

## 3. Núcleo Luxury Framework & Librería
ensure luxury_lib
ensure luxury_core

## 4. Puentes de Compatibilidad Multi-Framework (ESX, QBCore y Qbox)
ensure es_extended
ensure qb-core
ensure qbx_core

## 5. Ecosistema Overextended (ox_target & ox_inventory)
# ensure ox_target
# ensure ox_inventory

## 6. Módulos y Scripts del Ecosistema Luxury
ensure luxury_notify
ensure luxury_loading
ensure luxury_multicharacter
ensure luxury_hud
ensure luxury_banking
ensure luxury_garage
ensure luxury_radial

## ====================================================================
## PERMISOS ADMINISTRATIVOS (ACE & PRINCIPALS)
## ====================================================================
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.luxury_core command allow

## Asignar Rango de Administrador (Reemplaza con tu licencia de FiveM)
# add_principal identifier.license:TU_LICENCIA_AQUI group.admin

## Permisos de Sistema de Archivos para Auto-Updater (luxury_core)
add_filesystem_permission luxury_core write cfxlua-require
add_filesystem_permission luxury_core write require
add_filesystem_permission luxury_core write es_extended
add_filesystem_permission luxury_core write qb-core
add_filesystem_permission luxury_core write qbx_core
add_filesystem_permission luxury_core write luxury_lib
add_filesystem_permission luxury_core write luxury_hud
add_filesystem_permission luxury_core write luxury_banking
add_filesystem_permission luxury_core write luxury_garage
add_filesystem_permission luxury_core write luxury_radial
add_filesystem_permission luxury_core write luxury_multicharacter
