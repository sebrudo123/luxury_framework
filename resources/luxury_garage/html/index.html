<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Garage - okokGarage Style</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Contenedor Principal del Garaje -->
  <div id="garage-backdrop" class="garage-backdrop" style="display: none;">
    <div class="garage-card">
      
      <!-- Cabecera Superior -->
      <header class="garage-header">
        <div class="header-brand">
          <div class="garage-brand-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 10.9 2 11.2 2 11.5V16c0 .6.4 1 1 1h2"></path>
              <circle cx="7" cy="17" r="2"></circle>
              <circle cx="17" cy="17" r="2"></circle>
            </svg>
          </div>
          <div class="header-text">
            <h1 id="txt-garage-title">GARAJE CENTRAL</h1>
            <span id="txt-garage-subtitle">VEHÍCULOS EN PROPIEDAD</span>
          </div>
        </div>

        <div class="header-controls">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="input-search-vehicle" placeholder="Buscar por modelo o matrícula..." />
          </div>

          <button id="btn-close-garage" class="btn-exit" title="Cerrar (ESC)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Barra de Filtros y Contador -->
      <div class="garage-filter-bar">
        <div class="filter-pills">
          <button class="btn-filter active" data-filter="all">Todos (<span id="count-all">0</span>)</button>
          <button class="btn-filter" data-filter="stored">En Garaje (<span id="count-stored">0</span>)</button>
          <button class="btn-filter" data-filter="out">En Depósito (<span id="count-out">0</span>)</button>
        </div>

        <div id="impound-fee-badge" class="impound-fee-pill" style="display: none;">
          <span>Tasa de Rescate: <strong id="txt-impound-cost">$1,500</strong></span>
        </div>
      </div>

      <!-- Cuadrícula de Vehículos -->
      <main id="vehicle-grid" class="vehicle-grid">
        <div class="empty-garage">
          <p>Cargando vehículos...</p>
        </div>
      </main>

    </div>
  </div>

  <!-- Barra de pruebas en navegador -->
  <div id="browser-test-bar" style="display: none;">
    <button id="btn-test-garage">Probar Garaje</button>
    <button id="btn-test-impound">Probar Depósito</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
