<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Loading Screen</title>
    <!-- Fuentes tipográficas elegantes de alta fidelidad -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Montserrat:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos de la Pantalla -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ================= 1. VÍDEO LOCAL DE FONDO ================= -->
    <div class="local-video-background">
        <video id="bg-local-video" loop muted autoplay playsinline></video>
        <div class="cinematic-vignette" id="cinematic-vignette"></div>
        <div class="luxury-dust-glow"></div>
    </div>

    <!-- Cursor personalizado de Lujo -->
    <div id="custom-cursor" class="custom-cursor">
        <div class="cursor-dot"></div>
        <div class="cursor-ring"></div>
    </div>

    <!-- ================= 2. VIEWPORT CINEMATOGRÁFICO ================= -->
    <div class="cinematic-app-frame">

        <!-- HEADER MINIMALISTA SUPERIOR -->
        <header class="luxury-top-bar">
            <!-- Branding / Logo del Servidor -->
            <div class="server-brand">
                <div class="logo-container">
                    <img id="server-logo" src="assets/images/logo.svg" alt="Luxury Logo" class="brand-logo">
                    <div class="logo-ambient-glow"></div>
                </div>
                <div class="brand-info">
                    <div class="brand-title-row">
                        <span id="server-name">LUXURY</span>
                        <span id="server-name-highlight" class="gold-gradient-text">ROLEPLAY</span>
                        <span id="server-badge" class="server-badge">V3.0</span>
                    </div>
                    <span id="server-tagline" class="brand-tagline">DONDE EL LUJO Y EL ROL ALCANZAN SU MÁXIMO NIVEL</span>
                </div>
            </div>

            <!-- Botón Rápido de Discord -->
            <div class="top-bar-right">
                <button class="discord-quick-pill" id="btn-discord-copy" title="Copiar invitación de Discord">
                    <svg viewBox="0 0 24 24" class="dc-icon"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/></svg>
                    <span>DISCORD</span>
                </button>
            </div>
        </header>

        <!-- ESPACIO CENTRAL 100% LIMPIO (VÍDEO TOTALMENTE NÍTIDO) -->
        <main class="clean-cinematic-center"></main>

        <!-- ================= 3. ZONA INFERIOR: BARRA ESTILO ORIGEN + SPOTIFY ABAJO A LA DERECHA ================= -->
        <footer class="bottom-interface-row">
            
            <!-- ================= BARRA DE CARGA EXACTA ESTILO ORIGEN ================= -->
            <div class="origen-loader-box">
                <!-- Fila Superior: Dot + Título + Tag de Fase + Porcentaje -->
                <div class="origen-header-row">
                    <div class="origen-left-title">
                        <span class="origen-live-dot"></span>
                        <span class="origen-label">CARGANDO RECURSOS</span>
                        <span class="origen-tag" id="origen-stage-badge">FASE 1/4</span>
                    </div>

                    <div class="origen-percentage-wrap">
                        <span class="origen-pct-val" id="origen-pct-number">0</span><span class="origen-pct-unit">%</span>
                    </div>
                </div>

                <!-- Barra de Progreso Origen (Pista Slim con Chispa en la Punta) -->
                <div class="origen-bar-track">
                    <div class="origen-bar-fill" id="origen-fill">
                        <!-- Chispa frontal brillante de Origen -->
                        <div class="origen-spark-point"></div>
                    </div>
                </div>

                <!-- Fila Inferior: Log de FiveM en Vivo y Tip Rotativo -->
                <div class="origen-footer-row">
                    <div class="origen-status-group">
                        <span class="origen-status-prefix">ESTADO:</span>
                        <span class="origen-log-msg" id="origen-log-message">Sincronizando con FiveM...</span>
                    </div>
                    <div class="origen-tip-group">
                        <svg viewBox="0 0 24 24" class="tip-svg-icon" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        <span class="origen-tip-rotator" id="origen-tip-rotator">Cargando recursos del servidor...</span>
                    </div>
                </div>
            </div>

            <!-- ================= REPRODUCTOR SPOTIFY COMPACTO (ABAJO A LA DERECHA) ================= -->
            <div class="bottom-right-player-wrapper">
                
                <!-- Tarjeta Desplegable de la Lista de Canciones (POPOVER) -->
                <div class="playlist-popover-card hidden" id="playlist-popover">
                    <div class="popover-header">
                        <div class="popover-title-row">
                            <svg viewBox="0 0 24 24" class="sp-pop-icon"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                            <span class="popover-title" id="popover-playlist-title">Spotify Playlist</span>
                        </div>
                        <button class="popover-close-btn" id="btn-close-popover" title="Cerrar lista">
                            <svg viewBox="0 0 24 24" class="svg-close-icon"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                        </button>
                    </div>

                    <!-- Lista de canciones dinámica -->
                    <div class="popover-tracklist" id="popover-tracklist">
                        <!-- Inyectado dinámicamente -->
                    </div>

                    <div class="popover-footer">
                        <a href="#" target="_blank" class="btn-open-spotify" id="btn-open-spotify-link">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                            <span>ABRIR EN SPOTIFY</span>
                        </a>
                    </div>
                </div>

                <!-- Barra Principal del Mini-Player Spotify -->
                <div class="mini-spotify-player" id="mini-spotify-player">
                    <div class="player-left-col">
                        <div class="sp-mini-icon-box">
                            <svg viewBox="0 0 24 24" class="sp-mini-icon"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                        </div>
                        <div class="sp-mini-track-info">
                            <span class="track-title" id="player-track-title">Cargando...</span>
                            <span class="track-artist" id="player-track-artist">Spotify Music</span>
                        </div>
                    </div>

                    <div class="player-right-actions">
                        <!-- Botón Play / Pause -->
                        <button class="player-btn btn-play-pause" id="btn-toggle-play" title="Pausar / Reproducir">
                            <svg id="icon-play" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>

                        <!-- Botón Siguiente Canción -->
                        <button class="player-btn" id="btn-next-track" title="Siguiente canción">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>

                        <!-- Botón Ver Lista -->
                        <button class="player-btn btn-view-list" id="btn-toggle-list" title="Ver lista de canciones">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                        </button>
                    </div>
                </div>

            </div>

        </footer>

    </div>

    <!-- Elemento de Audio HTML5 -->
    <audio id="audio-engine" preload="auto"></audio>

    <!-- Notificación Toast Elegante (100% SVG Vectorial) -->
    <div id="luxury-toast" class="luxury-toast">
        <div class="toast-icon">
            <svg viewBox="0 0 24 24" class="svg-check"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="toast-text" id="toast-message">Enlace copiado al portapapeles</div>
    </div>

    <!-- Scripts de Configuración y Motor de la Pantalla -->
    <script src="config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
