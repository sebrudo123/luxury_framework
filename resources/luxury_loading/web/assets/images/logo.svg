<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Oro de Alta Gama -->
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="35%" stop-color="#e6ca65" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6d1c" />
    </linearGradient>

    <!-- Gradiente Oscuro de Fondo -->
    <radialGradient id="shieldDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="85%" stop-color="#0c0c10" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>

    <!-- Filtro de Resplandor Dorado -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Escudo / Polígono Base de Lujo -->
  <polygon points="100,10 185,55 185,145 100,190 15,145 15,55" 
           fill="url(#shieldDark)" 
           stroke="url(#luxuryGold)" 
           stroke-width="3" 
           filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.8))" />

  <!-- Línea interior geométrica -->
  <polygon points="100,22 173,61 173,139 100,178 27,139 27,61" 
           fill="none" 
           stroke="url(#luxuryGold)" 
           stroke-width="1.2" 
           stroke-opacity="0.4" />

  <!-- Diamante / Corona Central -->
  <g transform="translate(100, 95) scale(1.15)">
    <!-- Facetas del Diamante -->
    <polygon points="0,-45 -35,-15 35,-15" fill="url(#luxuryGold)" opacity="0.9" filter="url(#goldGlow)"/>
    <polygon points="-35,-15 0,40 0,-15" fill="url(#luxuryGold)" opacity="0.75"/>
    <polygon points="35,-15 0,40 0,-15" fill="url(#luxuryGold)" opacity="0.85"/>
    
    <!-- Alas Superiores de Corona -->
    <polygon points="-35,-15 -20,-38 -5,-15" fill="#fff8db" opacity="0.95"/>
    <polygon points="35,-15 20,-38 5,-15" fill="#fff8db" opacity="0.95"/>
    <polygon points="0,-48 -12,-20 12,-20" fill="#ffffff" opacity="0.9"/>

    <!-- Inicial L de LUXURY estilizada -->
    <path d="M-8,-8 L-8,14 L12,14" fill="none" stroke="#060608" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-8,-8 L-8,14 L12,14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pequeños destellos decorativos -->
  <circle cx="100" cy="18" r="2.5" fill="#fff8db" filter="url(#goldGlow)" />
  <circle cx="180" cy="58" r="2" fill="#fff8db" />
  <circle cx="20" cy="58" r="2" fill="#fff8db" />
</svg>
